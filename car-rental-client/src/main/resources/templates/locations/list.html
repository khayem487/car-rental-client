<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('Mes réservations')}">
    </head>
    <body>
        <header th:replace="~{layout :: header('bookings')}">
        </header>
        <main id="main">
            <section class="shell section">
                <p class="eyebrow">Votre espace</p>
                <div class="section-heading">
                    <h1 class="page-title">Vos <em>trajets.</em>
                    </h1>
                    <a class="button" th:href="@{/voitures}">Trouver une voiture ↗</a>
                </div>
                <div th:replace="~{layout :: alerts}">
                </div>
                <div class="stats-row">
                    <div>
                        <strong th:text="${totalLocations}">
                        </strong>
                        <span>Réservation(s)</span>
                    </div>
                    <div>
                        <strong th:text="${activeLocations}">
                        </strong>
                        <span>En cours</span>
                    </div>
                    <div>
                        <strong th:text="${completedLocations}">
                        </strong>
                        <span>Terminée(s)</span>
                    </div>
                </div>
                <div class="tabs">
                    <a th:href="@{/locations}" th:classappend="${activeOnly == null} ? 'selected'">Tous les trajets</a>
                    <a th:href="@{/locations/actives}" th:classappend="${activeOnly != null} ? 'selected'">En cours</a>
                </div>
                <div class="rental-list">
                    <article class="rental-row panel" th:each="loc : ${locations}">
                        <div class="rental-mini tone-green">
                            <svg th:replace="~{layout :: car}">
                            </svg>
                        </div>
                        <div>
                            <span class="availability" th:text="${loc.etat == 'EN_COURS' ? 'En cours' : 'Terminée'}">
                            </span>
                            <h3 th:text="${loc.voiture != null ? loc.voiture.marque + ' ' + loc.voiture.model : loc.mat}">
                            </h3>
                            <span class="micro" th:text="${loc.mat}">
                            </span>
                        </div>
                        <div class="rental-date">
                            <span>Départ</span>
                            <strong th:text="${#dates.format(loc.dteDeb,'dd/MM/yyyy')}">
                            </strong>
                            <small th:text="${loc.duree + ' jour(s)'}">
                            </small>
                        </div>
                        <div class="rental-amount">
                            <strong th:text="${#numbers.formatDecimal(loc.montantTotal,1,'WHITESPACE',2,'COMMA') + ' €'}">
                            </strong>
                            <small>Total du trajet</small>
                        </div>
                        <a class="button button-outline" th:href="@{/locations/{id}(id=${loc.id_location})}">Voir le détail ↗</a>
                    </article>
                </div>
                <div class="empty-state" th:if="${locations.isEmpty()}">
                    <span class="empty-symbol">↗</span>
                    <h2>Votre prochain trajet vous attend.</h2>
                    <p>Votre historique apparaîtra ici après une réservation.</p>
                    <a class="button" th:href="@{/voitures}">Choisir ma voiture</a>
                </div>
            </section>
        </main>
        <footer th:replace="~{layout :: footer}">
        </footer>
    </body>
</html>
