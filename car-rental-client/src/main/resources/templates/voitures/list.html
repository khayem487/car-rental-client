<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('Les voitures')}">
    </head>
    <body>
        <header th:replace="~{layout :: header('catalog')}">
        </header>
        <main id="main">
            <section class="shell section">
                <p class="eyebrow">Le catalogue</p>
                <div class="section-heading">
                    <h1 class="page-title">Le choix du <em>départ.</em>
                    </h1>
                    <p class="muted">À chaque trajet sa voiture.<br>Affinez votre sélection.</p>
                </div>
                <div th:replace="~{layout :: alerts}">
                </div>
                <form class="filters panel" th:action="@{/voitures/filter}" method="get">
                    <div class="field">
                        <label for="marque">Marque ou modèle</label>
                        <input id="marque" name="marque" placeholder="Renault, Clio…" th:value="${marque}">
                    </div>
                    <div class="field">
                        <label for="nbplace">Places minimum</label>
                        <select id="nbplace" name="nbplace">
                            <option value="0">Toutes</option>
                            <option th:each="n : ${ {2,4,5,7} }" th:value="${n}" th:text="${n + ' places'}" th:selected="${nbplace != null && nbplace == n}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="prixMax">Budget / jour maximum</label>
                        <input id="prixMax" name="prixMax" type="number" min="0" step="1" placeholder="En euros" th:value="${prixMax != null && prixMax > 0 ? prixMax : ''}">
                    </div>
                    <label class="check">
                        <input type="checkbox" name="disponible" value="true" th:checked="${disponibleSeulement}"> Disponibles uniquement</label>
                    <button class="button" type="submit">Rechercher ↗</button>
                </form>
                <div class="results-meta">
                    <p>
                        <strong th:text="${voitures.size()}">
                        </strong> véhicule(s) dans cette sélection</p>
                    <a th:href="@{/voitures}" class="text-link">Réinitialiser les filtres</a>
                </div>
                <div class="car-grid">
                    <th:block th:each="car : ${voitures}"><article th:replace="~{layout :: carCard(${car})}">
                        </article></th:block>
                </div>
                <div th:if="${voitures.isEmpty()}" class="empty-state">
                    <span class="empty-symbol">↗</span>
                    <h2>Aucun véhicule pour ces critères.</h2>
                    <p>Essayez un budget plus large ou une autre marque.</p>
                    <a class="button" th:href="@{/voitures}">Voir toutes les voitures</a>
                </div>
            </section>
        </main>
        <footer th:replace="~{layout :: footer}">
        </footer>
    </body>
</html>
