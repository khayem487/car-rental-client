# Demo profile for cloud deployments (Render free tier)
spring.datasource.url=jdbc:h2:mem:carrental;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Initialize schema + seed data for demo mode
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Thymeleaf settings
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Render injects PORT env var
server.port=${PORT:8080}
